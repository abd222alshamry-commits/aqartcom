<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>البحث بالخريطة — عقارتكم</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="map-search.css"><link rel="stylesheet" href="/mobile-ui.css?v=2"><script src="/mobile-ui.js?v=2" defer></script><script src="/site-ui.js"></script><link rel="stylesheet" href="/site-ui.css"><link rel="stylesheet" href="/map-basemaps.css"></head><body data-page="map-search"><header><a href="/" class="brand">⌂ عقارتكم</a><div class="view-actions"><a id="compareLink" href="/compare.html">المقارنة</a><button id="locate">📍 موقعي</button><button id="saveArea">🔔 حفظ المنطقة</button></div></header><main><aside class="filters"><button id="closeFilters" class="close-filters" type="button">إغلاق الفلاتر والنتائج ×</button><h1>البحث بالخريطة</h1><p>حرّك الخريطة ثم اضغط «بحث في هذه المنطقة». تظهر هنا الإعلانات ذات الإحداثيات المحددة فقط؛ بقية إعلانات المكاتب متاحة في البحث الرئيسي.</p><label>المحافظة<select id="city"></select></label><label>المدينة / البلدة / القرية<input id="district" disabled></label><label>نوع العملية<select id="mode"><option value="">بيع وإيجار</option><option>بيع</option><option>إيجار</option></select></label><label>نوع العقار<select id="type"><option value="">كل الأنواع</option><option>شقة</option><option>منزل</option><option>فيلا</option><option>أرض</option><option>محل تجاري</option><option>مكتب</option><option>بناء</option><option>مزرعة</option></select></label><div class="two"><label>السعر من<input id="minPrice" type="number"></label><label>السعر إلى<input id="maxPrice" type="number"></label></div><label>غرف النوم<select id="rooms"><option value="">الكل</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5+</option></select></label><div class="tools"><button id="draw">✏️ رسم نطاق</button><button id="finish" disabled>✓ إنهاء</button><button id="resetArea">إلغاء النطاق</button><button id="circle">◯ بحث دائري</button><select id="radius"><option value="2">2 كم</option><option value="5" selected>5 كم</option><option value="10">10 كم</option><option value="25">25 كم</option><option value="50">50 كم</option></select></div><button class="search" id="searchBounds">بحث في هذه المنطقة</button><div id="summary" class="summary">حرّك الخريطة لبدء البحث.</div><div id="results" class="results"></div></aside><section class="map-wrap"><div id="map"></div><button id="mobileFilters" class="mobile-filters">☰ الفلاتر والنتائج</button></section></main><div id="toast" class="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="map-basemaps.js"></script><script src="map-layout.js"></script><script src="syria-localities.js"></script><script src="location-picker.js"></script><script src="map-search.js"></script></body></html>
