<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الإعلانات | عقارتكم</title><link rel="stylesheet" href="/sol.css?v=2"><link rel="stylesheet" href="/listing-actions.css?v=1"></head><body>
<header><a class="brand" href="/">⌂ عقارتكم</a><nav><a href="/">تصفح الإعلانات</a><a href="/offer-review.html" id="reviewLink" hidden>مراجعة العروض</a><button id="logout" class="quiet" hidden>تسجيل الخروج</button></nav></header>
<main><section class="hero"><div><h1>إدارة الإعلانات</h1><p>عدّل بيانات الإعلان، احذفه من الموقع، أو شارك رابطه.</p><p id="accountLabel"></p></div></section><p id="managementMessage" role="status"></p>
<section id="signIn" class="panel" hidden><h2>سجّل الدخول لإدارة إعلاناتك</h2><form id="listingLogin"><label>البريد الإلكتروني<input type="email" name="email" autocomplete="username" required></label><label>كلمة المرور<input type="password" name="password" autocomplete="current-password" required></label><button>دخول</button></form><p><a href="/host-portal.html">إنشاء حساب</a></p></section>
<section id="workspace" hidden><form id="listingFilters" class="panel"><div class="two"><label>البحث<input name="q" maxlength="150" placeholder="عنوان الإعلان أو المدينة"></label><label>القسم<select name="kind"><option value="">جميع الأقسام</option value="property">العقارات</option><option value="market">عروض المكاتب</option><option value="hotel">الفنادق والشقق المفروشة والمزارع</option></select></label></div><button>بحث</button></form><p id="listingCount" role="status"></p><div id="managedListings"></div><div class="actions"><button id="previousListings" class="quiet">السابق</button><span id="listingPage"></span><button id="nextListings" class="quiet">التالي</button></div></section>
