<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدفع | عقارتكم</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.moyasar.com/mpf/1.15.0/moyasar.css"><style>body{font-family:Cairo,Arial;background:#f5f7fb;margin:0;color:#172033}.box{max-width:620px;margin:5vh auto;background:#fff;padding:30px;border-radius:22px;box-shadow:0 20px 50px #0001}.brand{color:#123b70;font-size:24px;font-weight:800}.sum{background:#f4f7fb;padding:18px;border-radius:15px;margin:20px 0}.muted{color:#788398}.ok{color:#147346;background:#e7f8ef;padding:14px;border-radius:12px}.err{color:#9a1c1c;background:#fff0f0;padding:14px;border-radius:12px}.mysr-form{margin-top:20px}.sham-box{background:#f7f4ea;border:1px solid #e5d8ae;padding:18px;border-radius:15px;margin-top:18px}.sham-address{font-size:18px;font-weight:800;direction:ltr;text-align:center;word-break:break-all;background:#fff;padding:12px;border-radius:10px}.sham-box input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccd3df;border-radius:10px;font-family:inherit;margin:10px 0}.sham-box button{width:100%;padding:13px;border:0;border-radius:10px;background:#123b70;color:#fff;font-family:inherit;font-weight:800;cursor:pointer}</style><script src="/site-ui.js"></script><link rel="stylesheet" href="/site-ui.css"></head><body><div class="box"><div class="brand">⌂ عقارتكم</div><h1>إتمام الدفع</h1><div id="content">جاري تجهيز الدفع...</div><div id="form"></div></div><script src="https://cdn.moyasar.com/mpf/1.15.0/moyasar.js"></script><script>
const id=new URLSearchParams(location.search).get('payment');
const providerId=new URLSearchParams(location.search).get('id');
const stripeSessionId=new URLSearchParams(location.search).get('stripe_session_id');
const paypalToken=new URLSearchParams(location.search).get('token');
const providerParam=new URLSearchParams(location.search).get('provider');
const $=x=>document.querySelector(x);
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'تعذر تنفيذ العملية');return j}
async function verify(idFromCallback){try{const j=await api('/api/checkout/'+id+'/verify?provider_id='+encodeURIComponent(idFromCallback));if(j.status==='paid'){ $('#form').innerHTML='<div class="ok">تم الدفع بنجاح وإضافة الرصيد/تفعيل الاشتراك.</div><p><a href="/office-growth.html?tab=wallet">العودة إلى لوحة المكتب</a></p>'; }else if(j.status==='failed'){ $('#form').innerHTML='<div class="err">لم تتم عملية الدفع.</div>'; }else $('#form').innerHTML='<div class="muted">جاري انتظار تأكيد عملية الدفع...</div>';}catch(e){$('#form').innerHTML='<div class="err">'+e.message+'</div>'}}
async function verifyStripe(sessionId){try{const j=await api('/api/checkout/'+id+'/stripe/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId})});if(j.status==='paid')$('#form').innerHTML='<div class="ok">تم الدفع عبر Stripe بنجاح.</div><p><a href="/office-growth.html?tab=wallet">العودة إلى لوحة المكتب</a></p>';else $('#form').innerHTML='<div class="muted">حالة الدفع: '+String(j.status||'pending')+'</div>';}catch(e){$('#form').innerHTML='<div class="err">'+e.message+'</div>'}}
async function capturePaypal(orderId){try{const j=await api('/api/checkout/'+id+'/paypal/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:orderId})});if(j.status==='paid')$('#form').innerHTML='<div class="ok">تم الدفع عبر PayPal بنجاح.</div><p><a href="/office-growth.html?tab=wallet">العودة إلى لوحة المكتب</a></p>';else $('#form').innerHTML='<div class="err">لم يكتمل الدفع: '+String(j.status||'unknown')+'</div>';}catch(e){$('#form').innerHTML='<div class="err">'+e.message+'</div>'}}
async function load(){try{const d=await api('/api/checkout/'+id);const p=d.data;$('#content').innerHTML='<div class="sum"><b>'+String(p.plan_name||(p.metadata?.kind==='wallet_topup'?'شحن المحفظة الإعلانية':'اشتراك المكتب'))+'</b><p class="muted">'+Number(p.amount).toLocaleString('ar')+' '+p.currency+'</p><small>مزود الدفع: '+p.provider+'</small></div>';
if(p.status==='paid'){ $('#form').innerHTML='<div class="ok">تم الدفع بنجاح.</div>';return;}
if(stripeSessionId){await verifyStripe(stripeSessionId);return;}
if(providerParam==='paypal'&&paypalToken){await capturePaypal(paypalToken);return;}
const c=await api('/api/checkout/'+id+'/config');
if(c.provider==='stripe'){ location.href=c.checkout_url; return; }
if(c.provider==='paypal'){ location.href=c.checkout_url; return; }
if(c.provider==='moyasar'){
  if(providerId){await verify(providerId);return;}
  $('#form').innerHTML='<div class="mysr-form"></div>';
  Moyasar.init({element:'.mysr-form',amount:c.amount_minor,currency:c.currency,description:c.description,publishable_api_key:c.publishable_api_key,callback_url:c.callback_url,supported_networks:['visa','mastercard','mada','amex','unionpay'],methods:['creditcard','applepay','stcpay'],on_completed:async function(payment){ if(payment&&payment.id){ try{await api('/api/checkout/'+id+'/attach-provider',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider_payment_id:payment.id})});}catch(e){} await verify(payment.id); }}});
}else if(c.provider==='syriatel_cash'){
 $('#form').innerHTML='<div class="sham-box"><h3>الدفع عبر سيرياتيل كاش</h3><p>حوّل <b>'+Number(c.amount).toLocaleString('ar')+' '+c.currency+'</b> إلى حساب عقارتكم:</p><div class="sham-address">'+String(c.recipient||'غير مهيأ')+'</div><p class="muted">'+String(c.instructions)+'</p><input id="syriaTx" inputmode="text" placeholder="رقم عملية سيرياتيل كاش"><button id="syriaSubmit">إرسال للمراجعة</button><div id="syriaMsg" class="muted" style="margin-top:10px"></div></div>';
 $('#syriaSubmit').onclick=async()=>{const tx=$('#syriaTx').value.trim();$('#syriaMsg').textContent='جاري الإرسال...';try{const r=await api('/api/checkout/'+id+'/syriatel/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({transaction_id:tx})});$('#form').innerHTML='<div class="ok">تم إرسال تحويل سيرياتيل كاش للمراجعة. سيتم إضافة الرصيد بعد اعتماد الإدارة.</div><p><a href="/office-growth.html?tab=wallet">العودة إلى المحفظة</a></p>';}catch(e){$('#syriaMsg').textContent=e.message;}};
}else if(c.provider==='shamcash'){
  $('#form').innerHTML='<div class="sham-box"><h3>الدفع عبر شام كاش</h3><p>حوّل <b>'+Number(c.amount).toLocaleString('ar')+' '+c.currency+'</b> إلى حساب عقارتكم:</p><div class="sham-address">'+String(c.recipient)+'</div><p class="muted">'+String(c.instructions)+'</p><input id="shamTx" inputmode="numeric" placeholder="رقم عملية شام كاش"><button id="shamVerify">تحقق من الدفع</button><div id="shamMsg" class="muted" style="margin-top:10px"></div></div>';
  $('#shamVerify').onclick=async()=>{const tx=$('#shamTx').value.trim();$('#shamMsg').textContent='جاري التحقق...';try{const r=await api('/api/checkout/'+id+'/shamcash/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({transaction_id:tx})});if(r.status==='paid'){ $('#form').innerHTML='<div class="ok">تم التحقق من تحويل شام كاش وإضافة الرصيد بنجاح.</div><p><a href="/office-growth.html?tab=wallet">العودة إلى المحفظة</a></p>'; }else $('#shamMsg').textContent=r.message||'لم يتم العثور على العملية.';}catch(e){$('#shamMsg').textContent=e.message;}};
}else{
  $('#form').innerHTML='<button id="pay" style="width:100%;padding:14px;border:0;border-radius:12px;background:#123b70;color:#fff;font-family:inherit;font-weight:800;font-size:16px;cursor:pointer">تأكيد الدفع التجريبي</button>';
  $('#pay').onclick=async()=>{try{await api('/api/checkout/'+id+'/pay',{method:'POST',headers:{'Content-Type':'application/json'}});location.href='/office-growth.html?tab=wallet';}catch(e){alert(e.message)}};
}
}catch(e){$('#content').innerHTML='<div class="err">'+e.message+'</div>'}}
if(id)load();else $('#content').innerHTML='<div class="err">رابط الدفع غير صحيح.</div>';
</script></body></html>
