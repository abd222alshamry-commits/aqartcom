services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aqartkom
      POSTGRES_USER: aqartkom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U aqartkom"], interval: 10s, timeout: 5s, retries: 5}
  app:
    build: .
    restart: unless-stopped
    depends_on: {db: {condition: service_healthy}}
    ports: ["3000:3000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://aqartkom:${POSTGRES_PASSWORD}@db:5432/aqartkom
    volumes: ["uploads:/app/uploads", "backups:/app/backups", "private_uploads:/app/private_uploads"]
volumes: {postgres_data: {}, uploads: {}, backups: {}, private_uploads: {}}
