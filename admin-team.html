<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>فريق الإدارة | عقارتكم</title><link rel="stylesheet" href="manual-payments.css"><body><main><a href="/admin.html">العودة إلى لوحة الإدارة</a><h1>حسابات الإدارة وصلاحياتها</h1><p>حساب المالك كامل الصلاحيات. الحسابات الجديدة هنا تحصل فقط على الصلاحيات التي تختارها، ولا يمكنها إضافة مديرين أو تغيير صلاحياتهم.</p><p id="error" role="alert"></p><section id="workspace" hidden><form id="teamForm" class="panel"><h2 id="formTitle">إضافة مدير محدود</h2><label>الاسم<input name="name" required minlength="2" maxlength="120"></label><label>البريد الإلكتروني<input name="email" type="email" required autocomplete="off"></label><label id="passwordLabel">كلمة المرور الأولية<input name="password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></label><p>اختر الصلاحيات. تركها فارغة يمنع الوصول إلى أقسام الإدارة.</p><div id="permissions"></div><label><input name="active" type="checkbox" checked> الحساب نشط</label><button type="submit">حفظ</button><button type="button" id="resetForm">حساب جديد</button></form><h2>فريق الإدارة</h2><div id="team"></div></section></main><script src="admin-team.js?v=1"></script></body></html>
