name: Aqartkom
options:
  bundleIdPrefix: com.aqartkom
  deploymentTarget:
    iOS: '16.0'
targets:
  Aqartkom:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aqartkom.app
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: '0.92.0'
        CURRENT_PROJECT_VERSION: '92'
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: عقارتكم
        AqartkomURL: https://configure.invalid
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: التقاط صورة لإرفاقها بإعلانك عند اختيار الكاميرا.
        NSPhotoLibraryUsageDescription: اختيار صور العقار لإرفاقها بإعلانك.
