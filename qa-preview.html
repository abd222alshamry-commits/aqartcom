<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معاينة العرض</title><style>body{margin:0;background:#e4e9ef;font:15px Arial}header{display:flex;gap:14px;align-items:center;padding:14px}select,button{font:inherit;padding:9px}iframe{display:block;width:390px;height:844px;margin:auto;border:2px solid #34495e;border-radius:10px;background:#fff}</style><header><label>العرض <select id="width"><option value="390">جوال 390</option><option value="360">جوال 360</option><option value="768">جهاز لوحي 768</option><option value="1280">حاسوب 1280</option></select></label><label>الصفحة <select id="page"><option value="/">الرئيسية</option><option value="/map-search.html">الخريطة</option></select></label></header><iframe id="preview" title="معاينة الموقع" src="/"></iframe><script>document.getElementById('width').onchange=e=>document.getElementById('preview').style.width=e.target.value+'px';document.getElementById('page').onchange=e=>document.getElementById('preview').src=e.target.value;</script></html>
